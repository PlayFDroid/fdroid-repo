name: Build, Smoke-Test & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Game Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Automated Smoke Test on Android 14 Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: Nexus 5
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -noboot-anim
          script: |
            APK_PATH=$(find . -path "*/outputs/apk/debug/*.apk" | head -n 1)
            echo "Installing $APK_PATH..."
            adb install -r "$APK_PATH"
            PKG_NAME=$(aapt dump badging "$APK_PATH" | awk -F"'" '/package: name=/{print $2}')
            echo "Launching package: $PKG_NAME"
            adb logcat -c
            adb shell monkey -p "$PKG_NAME" -c android.intent.category.LAUNCHER 1
            sleep 10
            if adb logcat -d *:E | grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: $PKG_NAME"; then
              echo "❌ CRASH DETECTED DURING STARTUP!"
              adb logcat -d *:E
              exit 1
            else
              echo "✅ Game survived 10 seconds of execution without crashing!"
            fi

      - name: Sign & Build Release APK (On Tag Only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          UNSIGNED_APK=$(find . -path "*/outputs/apk/release/*-unsigned.apk" | head -n 1)
          ZIPALIGNED_APK="app-aligned.apk"
          FINAL_APK="${{ github.event.repository.name }}-${{ github.ref_name }}.apk"

          $ANDROID_HOME/build-tools/*/zipalign -v -p 4 "$UNSIGNED_APK" "$ZIPALIGNED_APK"
          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks release.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$FINAL_APK" \
            "$ZIPALIGNED_APK"
          rm -f release.jks "$ZIPALIGNED_APK"

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*-${{ github.ref_name }}.apk"
          generate_release_notes: true

      - name: Trigger Central F-Droid Index Rebuild
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.FDROID_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/fdroid-repo/dispatches \
            -d '{"event_type":"new-game-release","client_payload":{"repo":"${{ github.repository }}"}}'
