name: Update F-Droid Repository

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ new-game-release ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-fdroid:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout fdroid-repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python & fdroidserver
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="20" || true
          sudo apt-get install -y --no-install-recommends zipalign apksigner 2>/dev/null || true
          # Ensure Android SDK build tools (zipalign, apksigner) are in PATH
          BT_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT_DIR" ]; then
            echo "$BT_DIR" >> $GITHUB_PATH
          fi
          pip3 install --break-system-packages --upgrade "androguard>=4.1.1" fdroidserver

      - name: Restore Keystore & Configure fdroidserver
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd fdroid
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          chmod 600 keystore.jks
          cat <<EOF > config.yml
          repo_url: "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/fdroid/repo"
          repo_name: "PlayFDroid Open-Source Games"
          repo_description: "Classic open-source Android games and modern ports revived for Android 14/15/16+ (64-bit ARMv9)."
          archive_older: 0
          keystore: "keystore.jks"
          repo_keyalias: "$KEY_ALIAS"
          keystorepass: "$KEYSTORE_PASSWORD"
          keypass: "$KEY_PASSWORD"
          keydname: "CN=PlayFDroid, OU=OpenSource, O=PlayFDroid, L=Warsaw, S=MZ, C=PL"
          EOF
          chmod 600 config.yml

      - name: Fetch Latest APKs from Organization Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_releases.py

      - name: Build & Sign F-Droid Index
        run: |
          cd fdroid
          mkdir -p repo
          APK_COUNT=$(find repo -name "*.apk" 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -gt 0 ]; then
            fdroid update --create-metadata --pretty
          else
            echo "Notice: No APKs in repository yet. Skipping fdroid update."
          fi
          if [ -f obtainium-pack.json ]; then
            mv obtainium-pack.json repo/
          fi
          rm -f keystore.jks config.yml

      - name: Deploy Stateless Orphan Branch (Zero History Bloat)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-temp
          git rm -rf --cached . || true
          git add fdroid/repo/
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Automated F-Droid Index Update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git branch -M gh-pages
            git push -f origin gh-pages
          fi
